spring.application.name=city-complaint-system

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/city_complaint_db
spring.datasource.username=postgres
spring.datasource.password=Your_Postgress_Password

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
